services:
  app:
    image: crpi-v5h0koewouiw970u.cn-shanghai.personal.cr.aliyuncs.com/ebook-pdf-downloader-docker/ebook-pdf-downloader-docker:latest
    container_name: book-downloader
    depends_on:
      stacks:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"  # 让容器能访问宿主机代理 (Clash)
    ports:
      - "8000:8000"
    volumes:
      - ./downloads:/downloads
      - ./finished:/finished
      - ./tmp:/tmp/bdw
      - ./db:/db
      - ./paddlex_cache:/home/app/.paddlex
      - config_data:/app/data
    environment:
      - DOCKER=true
      - TZ=Asia/Shanghai
      - OMP_NUM_THREADS=1
      - PADDLE_NUM_THREADS=1
    restart: unless-stopped

  stacks:
    image: crpi-v5h0koewouiw970u.cn-shanghai.personal.cr.aliyuncs.com/ebook-pdf-downloader-docker/stacks:latest
    container_name: stacks
    stop_signal: SIGTERM
    stop_grace_period: 30s
    ports:
      - "7788:7788"
    volumes:
      - ./stacks-config:/opt/stacks/config
      - ./downloads:/opt/stacks/download
      - ./stacks-logs:/opt/stacks/logs
    environment:
      - USERNAME=admin
      - PASSWORD=password
      - SOLVERR_URL=http://flaresolverr:8191
      - FLARESOLVERR_ENABLED=true
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7788/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  flaresolverr:
    image: crpi-v5h0koewouiw970u.cn-shanghai.personal.cr.aliyuncs.com/ebook-pdf-downloader-docker/flaresolverr:latest
    container_name: flaresolverr
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped

volumes:
  config_data:
